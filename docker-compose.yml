# Layout follows the official "Running Airflow in Docker" compose file:
# https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html
# Spark runs as a standalone cluster (spark-master + 2 spark-worker replicas). Airflow tasks are the
# Spark driver (client mode). Every node mounts the repo at /opt/spark-app so landing, Delta and
# warehouse paths are identical on the driver and the executors.
# To fall back to local mode, set SPARK_MASTER=local[*] in .env.

# One image for Airflow and the Spark master/workers (same Java, Python and PySpark everywhere).
# Compose builds it once: every service shares the context and tag, so BuildKit reuses the layers.
# Each service keeps the build entry on purpose, so `docker compose up` works on a fresh checkout
# without a separate build step (a service with only `image:` would try to pull it from a registry).
x-ecom-image: &ecom-image
  build: .
  image: regional-ecom-airflow:latest

x-airflow-common: &airflow-common
  <<: *ecom-image
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/spark-app/dags
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    PYTHONPATH: /opt/spark-app
    SPARK_MASTER: ${SPARK_MASTER:-spark://spark-master:7077}
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
    SPARK_CORES_MAX: ${SPARK_CORES_MAX:-4}
    # Used by the pipeline code to reach the warehouse database.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - ./:/opt/spark-app
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate "airflow" metadata database (only when the volume is first created).
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: "no"

  # Standalone Spark cluster, built from the same image as Airflow (same Java, Python and PySpark).
  spark-master:
    <<: *ecom-image
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: ["/home/airflow/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"   # Spark master UI
    volumes:
      - ./:/opt/spark-app
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/spark-master/7077"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: "no"

  spark-worker:
    <<: *ecom-image
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: ["/home/airflow/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2g"]
    environment:
      # Python UDFs import project modules (jobs.*) on the executors, so they need the repo on the path.
      PYTHONPATH: /opt/spark-app
    volumes:
      - ./:/opt/spark-app
    depends_on:
      spark-master:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: "no"

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8085:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
